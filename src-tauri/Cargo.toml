[package]
name = "clearsight"
version = "1.0.1"
description = "See everything your Linux machine is doing, and clean it up in one click."
authors = ["Wyze3306"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rayon = "1.12"
trash = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 4
strip = true
debug = false
incremental = false
