<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clearsight</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="icon.png" alt="" width="28" height="28">
        <span>Clearsight</span>
      </div>
      <nav class="nav" aria-label="Sections">
        <button class="nav-item active" data-page="overview"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6v-9h-6zm0-16v5h6V4z"/></svg><span>Overview</span><kbd>1</kbd></button>
        <button class="nav-item" data-page="processes"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg><span>Apps &amp; processes</span><kbd>2</kbd></button>
        <button class="nav-item" data-page="memory"><svg viewBox="0 0 24 24"><path d="M6 7h12v10H6zM4 9H2v2h2zm0 4H2v2h2zm18-4h-2v2h2zm0 4h-2v2h2zM9 3h2v2H9zm4 0h2v2h-2zM9 19h2v2H9zm4 0h2v2h-2z"/></svg><span>Memory</span><kbd>3</kbd></button>
        <button class="nav-item" data-page="storage"><svg viewBox="0 0 24 24"><path d="M3 5h18v6H3zm0 8h18v6H3zm14-6v2h2V7zm0 8v2h2v-2z"/></svg><span>Storage</span><kbd>4</kbd></button>
        <button class="nav-item" data-page="cleanup"><svg viewBox="0 0 24 24"><path d="M15 3l-2 7h6l-9 11 2-8H6z"/></svg><span>Clean up</span><kbd>5</kbd></button>
      </nav>
      <div class="vitals" id="vitals"></div>
      <div class="sidebar-foot">
        <label class="speed">
          <span>Refresh</span>
          <select id="refresh">
            <option value="1000">Every second</option>
            <option value="2000" selected>Every 2 seconds</option>
            <option value="5000">Every 5 seconds</option>
            <option value="0">Paused</option>
          </select>
        </label>
        <button class="icon-btn" id="theme" title="Switch light or dark theme" aria-label="Switch theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
      </div>
    </aside>
    <main class="main">
      <section class="page active" id="page-overview"></section>
      <section class="page" id="page-processes"></section>
      <section class="page" id="page-memory"></section>
      <section class="page" id="page-storage"></section>
      <section class="page" id="page-cleanup"></section>
    </main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="js/main.js"></script>
</body>
</html>
